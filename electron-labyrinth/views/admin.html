<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Administration - Labyrinth</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <div style="padding: 10px;">
    <button onclick="window.location.href='dashboard.html'" style="background-color: #555; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px;">
      ↩ Retour au Jeu
    </button>
  </div>

  <h1>Panel Administration</h1>

  <div class="admin-section">
    <h2>📊 Statistiques Globales</h2>
    <p id="stats">Chargement des indicateurs...</p>
  </div>

  <div class="admin-section">
    <h2>👥 Gestion des Utilisateurs</h2>
    <table id="usersTable" border="1" style="width:100%; border-collapse: collapse; text-align: left;">
      <thead>
        <tr style="background-color: #333; color: white;">
          <th style="padding: 8px;">ID</th>
          <th style="padding: 8px;">Nom d'utilisateur</th>
          <th style="padding: 8px;">Rôle actuel</th>
          <th style="padding: 8px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        </tbody>
    </table>
  </div>

  <div class="admin-section">
    <h2>🧩 Liste Globale des Labyrinthes</h2>
    <table id="labTable" border="1" style="width:100%; border-collapse: collapse; text-align: left;">
      <thead>
        <tr style="background-color: #333; color: white;">
          <th style="padding: 8px;">ID</th>
          <th style="padding: 8px;">Créateur (User ID)</th>
          <th style="padding: 8px;">Nom du Labyrinthe</th>
          <th style="padding: 8px;">Difficulté</th>
          <th style="padding: 8px;">Taille</th>
          <th style="padding: 8px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        </tbody>
    </table>
  </div>

  <script src="../renderer/admin.js"></script>
</body>
</html>

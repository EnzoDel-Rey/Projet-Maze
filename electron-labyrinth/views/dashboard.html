<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Maze Game</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <h1>Maze Game</h1>

    <div class="topbar">
        <button id="logoutBtn">
            Déconnexion
        </button>
    </div>

    <div class="controls">
        <select id="size">
            <option value="small">
                Petit
            </option>
            <option value="medium">
                Moyen
            </option>
            <option value="large">
                Grand
            </option>
        </select>

        <input 
            type="range" 
            id="difficulty" 
            min="1" 
            max="10" 
            value="5"
        >

        <button id="generateBtn">
            Générer
        </button>

        <button id="solveBtn">
            Résoudre
        </button>

        <button id="saveBtn">
            Sauvegarder
        </button>
    </div>

    <canvas 
        id="mazeCanvas" 
        width="700" 
        height="700"
    ></canvas>

    <div class="saved-section">
        <h2>Mes labyrinthes sauvegardés</h2>
        
        <div id="mazeList">
            <p style="text-align:center; color:#aaa; font-style:italic;">Aucun labyrinthe sauvegardé</p>
        </div>
    </div>

    <script src="../renderer/dashboard.js"></script>
</body>
</html>
